name: Refresh fast-uri lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh lockfile entry
    runs-on: ubuntu-latest
    steps:
      - name: Update fast-uri to 3.1.4
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          TARGET_BRANCH: renovate/qs-6.x
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const apiUrl = process.env.FORGEJO_API_URL.replace(/\/$/, "");
          const token = process.env.FORGEJO_TOKEN;
          const repository = process.env.FORGEJO_REPOSITORY;
          const branch = process.env.TARGET_BRANCH;
          const path = "package-lock.json";

          async function request(method, url, body) {
            const response = await fetch(url, {
              method,
              headers: {
                Accept: "application/json",
                Authorization: `token ${token}`,
                "Content-Type": "application/json",
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`${method} ${url} failed: ${response.status} ${text}`);
            }
            return text ? JSON.parse(text) : null;
          }

          const encodedBranch = encodeURIComponent(branch);
          const fileUrl = `${apiUrl}/repos/${repository}/contents/${path}?ref=${encodedBranch}`;
          const file = await request("GET", fileUrl);
          const lock = JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
          const entry = lock.packages?.["node_modules/fast-uri"];
          if (!entry) throw new Error("node_modules/fast-uri is missing from package-lock.json");
          if (entry.version !== "3.1.3" && entry.version !== "3.1.4") {
            throw new Error(`Unexpected fast-uri version: ${entry.version}`);
          }

          entry.version = "3.1.4";
          entry.resolved = "https://artifacts.home.siczb.de/repository/npm-proxy/fast-uri/-/fast-uri-3.1.4.tgz";
          entry.integrity = "sha512-8JnbkQ4juDyvYs4mgFGQqg4yCYtFDtUtmp2QIQq11ZZe5CFQ5wcqm1rqDgAh/QdMySuBnPzMUiJUNZG5N/AiQw==";

          const content = Buffer.from(`${JSON.stringify(lock, null, 2)}\n`).toString("base64");
          await request("PUT", `${apiUrl}/repos/${repository}/contents/${path}`, {
            branch,
            sha: file.sha,
            message: "chore(deps): resolve fast-uri 3.1.4",
            content,
          });
          console.log("Updated fast-uri lockfile entry to 3.1.4.");
          NODE
