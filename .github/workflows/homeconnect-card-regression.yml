name: Home Connect Local card regression

on:
  push:
    branches:
      - feature/home-connect-local-maintenance
  pull_request:
    paths:
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/homeconnect-card-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate card source, distribution and regression tests
        run: npm test
      - name: Rebuild HACS distribution
        run: npm run build
      - name: Verify distribution is checked in
        run: git diff --exit-code -- dist/
