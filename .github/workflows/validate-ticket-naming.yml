# Supports local and repository-qualified ticket branches.
name: Validate ticket naming

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate naming convention
        shell: bash
        run: |
          set -euo pipefail
          head_ref="${GITHUB_HEAD_REF:-}"
          actor="${GITHUB_ACTOR:-}"
          pr_title="$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
          pr_created_at="$(jq -r '.pull_request.created_at // ""' "$GITHUB_EVENT_PATH")"
          case "$actor" in
            dependabot[bot]|github-actions[bot]) exit 0 ;;
          esac
          [[ "$pr_created_at" < '2026-07-02T08:10:46Z' ]] && exit 0
          types='(feature|enhancement|bugfix|hotfix|refactoring|maintenance|documentation|docs|security|test|research)'
          slug='[a-z0-9]+(-[a-z0-9]+)*'
          legacy="^${types}/([0-9]+)-${slug}$"
          qualified="^${types}/([a-z0-9][a-z0-9._-]*)-([0-9]+)-${slug}$"
          title='^#([0-9]+)[[:space:]]+.+$'
          if [[ "$head_ref" =~ $legacy ]]; then
            branch_ticket="${BASH_REMATCH[2]}"
          elif [[ "$head_ref" =~ $qualified ]]; then
            branch_ticket="${BASH_REMATCH[3]}"
          else
            echo "::error::Invalid ticket branch: $head_ref"
            exit 1
          fi
          [[ "$pr_title" =~ $title ]] || exit 1
          title_ticket="${BASH_REMATCH[1]}"
          [[ "$branch_ticket" == "$title_ticket" ]] || exit 1
